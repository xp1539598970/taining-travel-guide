<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖暖甜心换装 - 7k7k小游戏</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-section">
                <div class="logo-icon">👗</div>
                <h1 class="app-title">暖暖甜心换装</h1>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="saveBtn" title="Ctrl+S 保存搭配">
                    <span class="btn-icon">💾</span>
                    <span class="btn-text">保存</span>
                </button>
                <button class="action-btn" id="exportBtn" title="导出数据">
                    <span class="btn-icon">📤</span>
                    <span class="btn-text">导出</span>
                </button>
                <button class="action-btn" id="resetBtn" title="Ctrl+N 新建">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">重置</span>
                </button>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="character">
                <span class="tab-icon">👧</span>
                <span class="tab-text">角色选择</span>
            </button>
            <button class="tab-btn" data-tab="clothes">
                <span class="tab-icon">👚</span>
                <span class="tab-text">服装搭配</span>
            </button>
            <button class="tab-btn" data-tab="scene">
                <span class="tab-icon">🌅</span>
                <span class="tab-text">场景切换</span>
            </button>
            <button class="tab-btn" data-tab="gallery">
                <span class="tab-icon">📷</span>
                <span class="tab-text">作品展示</span>
            </button>
        </nav>

        <main class="main-content">
            <div class="game-canvas-container">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="scene-layer" id="sceneLayer"></div>
                    <div class="character-layer" id="characterLayer">
                        <div class="character-body" id="characterBody"></div>
                        <div class="clothes-layer" id="clothesLayer"></div>
                        <div class="accessory-layer" id="accessoryLayer"></div>
                    </div>
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <span class="loading-text">正在加载...</span>
                </div>
            </div>

            <aside class="tool-panel" id="toolPanel">
                <div class="panel-header">
                    <h2 class="panel-title" id="panelTitle">选择角色</h2>
                    <div class="category-tabs" id="categoryTabs"></div>
                </div>
                <div class="panel-content" id="panelContent"></div>
            </aside>
        </main>

        <div class="toast-container" id="toastContainer"></div>
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
