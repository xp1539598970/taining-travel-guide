<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖暖甜心换装</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-section">
                <svg class="logo-svg" viewBox="0 0 64 64" width="50" height="50">
                    <rect x="10" y="20" width="44" height="35" rx="5" fill="#FF6B9D"/>
                    <rect x="18" y="25" width="28" height="25" rx="3" fill="#FFB6C1"/>
                    <rect x="22" y="30" width="20" height="8" rx="2" fill="#FFC0CB"/>
                    <circle cx="28" cy="34" r="3" fill="#FF69B4"/>
                    <circle cx="36" cy="34" r="3" fill="#FF69B4"/>
                    <path d="M10 25 Q5 20 10 15" stroke="#FF6B9D" stroke-width="3" fill="none"/>
                    <path d="M54 25 Q59 20 54 15" stroke="#FF6B9D" stroke-width="3" fill="none"/>
                </svg>
                <h1 class="app-title">暖暖甜心换装</h1>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="saveBtn" title="Ctrl+S 保存">
                    <span>💾</span>
                    <span>保存</span>
                </button>
                <button class="action-btn" id="exportBtn" title="导出数据">
                    <span>📤</span>
                    <span>导出</span>
                </button>
                <button class="action-btn" id="resetBtn" title="Ctrl+N 重置">
                    <span>🔄</span>
                    <span>重置</span>
                </button>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="character">
                <svg viewBox="0 0 48 48" width="32" height="32">
                    <circle cx="24" cy="18" r="12" fill="#FFE4E1"/>
                    <path d="M14 14 Q24 8 34 14" stroke="#FF6B9D" stroke-width="3" fill="none"/>
                    <circle cx="20" cy="16" r="2" fill="#333"/>
                    <circle cx="28" cy="16" r="2" fill="#333"/>
                    <path d="M22 22 Q24 24 26 22" stroke="#FF6B9D" stroke-width="2" fill="none"/>
                    <rect x="18" y="30" width="12" height="15" rx="3" fill="#FFB6C1"/>
                    <line x1="14" y1="35" x2="18" y2="35" stroke="#FF6B9D" stroke-width="2"/>
                    <line x1="30" y1="35" x2="34" y2="35" stroke="#FF6B9D" stroke-width="2"/>
                </svg>
                <span>角色选择</span>
            </button>
            <button class="tab-btn" data-tab="clothes">
                <svg viewBox="0 0 48 48" width="32" height="32">
                    <rect x="12" y="10" width="24" height="32" rx="5" fill="#FF6B9D"/>
                    <rect x="16" y="18" width="16" height="8" rx="2" fill="#FFB6C1"/>
                    <rect x="14" y="28" width="20" height="14" rx="3" fill="#4169E1"/>
                    <circle cx="20" cy="34" r="2" fill="#FFD700"/>
                    <circle cx="28" cy="34" r="2" fill="#FFD700"/>
                </svg>
                <span>服装搭配</span>
            </button>
            <button class="tab-btn" data-tab="scene">
                <svg viewBox="0 0 48 48" width="32" height="32">
                    <rect x="0" y="25" width="48" height="23" fill="#4CAF50"/>
                    <circle cx="40" cy="8" r="6" fill="#FFD700"/>
                    <path d="M0 20 Q24 5 48 20" fill="#87CEEB"/>
                    <rect x="2" y="35" width="6" height="13" fill="#8B4513"/>
                    <ellipse cx="5" cy="32" rx="8" ry="4" fill="#228B22"/>
                    <rect x="38" y="38" width="4" height="10" fill="#8B4513"/>
                    <ellipse cx="40" cy="35" rx="6" ry="3" fill="#228B22"/>
                </svg>
                <span>场景切换</span>
            </button>
            <button class="tab-btn" data-tab="gallery">
                <svg viewBox="0 0 48 48" width="32" height="32">
                    <rect x="6" y="6" width="36" height="28" rx="2" fill="#E0E0E0"/>
                    <rect x="10" y="10" width="28" height="20" rx="1" fill="#FFF"/>
                    <circle cx="18" cy="18" r="6" fill="#FF6B9D"/>
                    <rect x="28" y="14" width="10" height="8" rx="1" fill="#4CAF50"/>
                    <rect x="28" y="24" width="10" height="6" rx="1" fill="#2196F3"/>
                    <circle cx="40" cy="40" r="6" fill="#FFD700"/>
                </svg>
                <span>作品展示</span>
            </button>
        </nav>

        <main class="main-content">
            <div class="game-canvas">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="scene-display" id="sceneDisplay"></div>
                    <div class="character-display" id="characterDisplay"></div>
                    <div class="outfit-layer" id="outfitLayer"></div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-header">
                    <h2 id="panelTitle">选择角色</h2>
                    <div class="sub-tabs" id="subTabs"></div>
                </div>
                <div class="panel-content" id="panelContent"></div>
            </aside>
        </main>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
